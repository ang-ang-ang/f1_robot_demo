[project]
name = "f1-robot-demo"
version = "0.1.0"
description = "F1 robot MCAP quality analysis and LeRobot conversion tools"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets==3.6.0",
    "huggingface-hub==0.32.3",
    "lerobot",
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.10",
    "pandas==2.2.3",
    "pyarrow==20.0.0",
    "torch==2.7.1",
    "torchcodec==0.4.0",
    "torchvision==0.22.1",
    "tqdm>=4.66",
    "tyro>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE001", "RUF001", "SLF001"]

[tool.uv.sources]
lerobot = { git = "https://gh.xmly.dev/https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
